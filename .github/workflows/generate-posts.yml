name: Build articles, posts.json and sitemap.xml

on:
  push:
    paths:
      - "articles_src/**"
      - "templates/**"
      - "scripts/build_article.js"
      - "scripts/generate_posts.js"
      - "scripts/generate_sitemap.js"
      - "scripts/fetch_eyecatch.js"
  workflow_dispatch:
    inputs:
      workflow_mode:
        description: "review or auto_publish"
        required: false
        default: "review"
      manual_request:
        description: "Optional natural-language article request"
        required: false
        default: ""
      run_ai_generation:
        description: "true to run AI article generation"
        required: false
        default: "true"
  schedule:
    - cron: "15 22 * * *"

permissions:
  contents: write

concurrency:
  group: generate-posts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Tokyo
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UTM_SOURCE: cctlab
      UTM_MEDIUM: referral
      WORKFLOW_MODE: ${{ github.event.inputs.workflow_mode || 'review' }}
      MANUAL_REQUEST: ${{ github.event.inputs.manual_request || '' }}
      RUN_AI_GENERATION: ${{ github.event.inputs.run_ai_generation || 'false' }}
      OPENAI_MODEL: gpt-5.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate article.md with AI
        if: >
          (github.event_name == 'workflow_dispatch' && env.RUN_AI_GENERATION == 'true') ||
          github.event_name == 'schedule'
        run: node scripts/generate_ai_article.js

      - name: Fetch eyecatch metadata
        if: github.event_name == 'push' || env.WORKFLOW_MODE == 'auto_publish'
        run: node scripts/fetch_eyecatch.js

      - name: Build article HTML
        if: github.event_name == 'push' || env.WORKFLOW_MODE == 'auto_publish'
        run: node scripts/build_article.js

      - name: Generate posts.json
        if: github.event_name == 'push' || env.WORKFLOW_MODE == 'auto_publish'
        run: node scripts/generate_posts.js

      - name: Generate sitemap.xml
        if: github.event_name == 'push' || env.WORKFLOW_MODE == 'auto_publish'
        run: node scripts/generate_sitemap.js

      - name: Commit generated files
        if: github.event_name == 'push' || env.WORKFLOW_MODE == 'auto_publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add articles data/posts.json sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: rebuild generated site files"
          git push