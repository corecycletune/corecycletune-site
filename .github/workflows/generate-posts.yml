name: Build articles, posts.json and sitemap.xml

on:
  push:
    paths:
      - "articles_src/**"
      - "templates/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/generate-posts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch eyecatch metadata
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UTM_SOURCE: cctlab
          UTM_MEDIUM: referral
        run: node scripts/fetch_eyecatch.js

      - name: Build article HTML
        run: node scripts/build_article.js

      - name: Generate posts.json
        run: node scripts/generate_posts.js

      - name: Generate sitemap.xml
        run: node scripts/generate_sitemap.js

      - name: Commit generated files (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add articles_src articles data/posts.json sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update eyecatch data and rebuild site"
          git push